version: 2

updates:
  - package-ecosystem: "github-actions"
    target-branch: "8.13.x"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "plumguardian"

  - package-ecosystem: "gradle"
    target-branch: "8.13.x"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "plumguardian"
    groups:
      freefair:
        patterns:
          - "io.freefair.settings.plugin-versions"
          - "io.freefair.gradle:lombok-plugin"
          - "io.freefair.gradle:aspectj-plugin"
